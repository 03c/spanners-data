name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  spike-egui:
    name: spike-egui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/spike-egui
      - name: build
        run: cargo build --release --manifest-path apps/spike-egui/Cargo.toml

      - name: upload spike binary
        uses: actions/upload-artifact@v4
        with:
          name: spike-egui-${{ matrix.os }}
          path: |
            apps/spike-egui/target/release/spike-egui
            apps/spike-egui/target/release/spike-egui.exe
          if-no-files-found: ignore

  spike-tauri:
    name: spike-tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/spike-tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/spike-tauri/src-tauri

      - name: install frontend deps
        working-directory: apps/spike-tauri
        run: pnpm install --frozen-lockfile

      - name: build frontend
        working-directory: apps/spike-tauri
        run: pnpm build

      - name: build shell
        working-directory: apps/spike-tauri
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: upload spike binary
        uses: actions/upload-artifact@v4
        with:
          name: spike-tauri-${{ matrix.os }}
          path: |
            apps/spike-tauri/src-tauri/target/release/spike-tauri
            apps/spike-tauri/src-tauri/target/release/spike-tauri.exe
          if-no-files-found: ignore
