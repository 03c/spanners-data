[workspace]
resolver = "2"
exclude = ["apps/spike-egui", "apps/spike-tauri/src-tauri"]
members = [
    "crates/driver-api",
    "crates/core",
    "crates/driver-sqlite",
    "crates/registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/03c/bData"

[workspace.dependencies]
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

spanners-driver-api = { path = "crates/driver-api" }
spanners-driver-sqlite = { path = "crates/driver-sqlite" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
