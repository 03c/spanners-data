[package]
name = "spanners-cli"
description = "Command-line access to Spanners Data: connections, queries, export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spanners"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27"

[dependencies]
spanners-app.workspace = true
spanners-core.workspace = true
spanners-driver-api.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["fs", "io-std"] }
serde_json.workspace = true
